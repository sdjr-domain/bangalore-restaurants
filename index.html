<html lang="en"><head><meta charset="utf-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box}

.sky{position:fixed;inset:0;opacity:0;transition:opacity 1.8s;z-index:0}
.s0{background:radial-gradient(120% 90% at 20% 0%,#7a2a5c,#2b0f2b 55%,#150716);opacity:1}

.s2{background:linear-gradient(160deg,#ff9a8b,#e0567a 50%,#3e2160)}
.s3{background:linear-gradient(160deg,#ff6f61,#b83a7a 45%,#241247)}
.s4{background:linear-gradient(160deg,#3a2a7a,#6a2a7a 45%,#0f0a2a)}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.35;z-index:1;animation:drift 20s ease-in-out infinite alternate;pointer-events:none}

.wrap{margin:auto;width:min(560px,100%)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);transition:.6s cubic-bezier(.3,1.5,.5,1)}
.dots i.done{background:var(--pink)}.dots i.on{width:38px;background:linear-gradient(90deg,var(--rose),var(--gold))}
.card{padding:36px 32px;border-radius:34px;background:linear-gradient(145deg,rgba(64,16,58,.62),rgba(38,10,44,.5));border:1px solid var(--line);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s}
.card.flat{transform:none;backdrop-filter:none;background:rgba(50,14,50,.66)}
.card.out{animation:out .33s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateY(-18px) scale(.96);filter:blur(10px)}}
.card>*:not(h1):not(h2){animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 200ms)}

textarea{width:100%;border-radius:20px;resize:none;margin:14px 0}
::placeholder{color:#d6a9bd}
.cm{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font:500 24px Fraunces,serif}
.cm button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-size:18px}
.cm button:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font-size:12px;color:var(--mut)}
.day{aspect-ratio:1;border-radius:50%;border:0;background:none;color:var(--ink);font:500 15px 'DM Sans',sans-serif;cursor:pointer;transition:.3s cubic-bezier(.3,1.5,.5,1)}
.cal.a .day{animation:pop .5s both;animation-delay:calc(var(--d)*16ms)}

.day:not(:disabled):hover{background:rgba(255,255,255,.2);transform:scale(1.15)}
.day.today{box-shadow:inset 0 0 0 1px var(--gold)}
.day.sel{background:linear-gradient(135deg,var(--rose),var(--gold));color:#3a0f2c;font-weight:600;transform:scale(1.14)}

.num{text-align:center;font:500 42px Fraunces,serif;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--rose) var(--p,66%),rgba(255,255,255,.2) var(--p,66%));margin:22px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:7px solid var(--rose);box-shadow:0 6px 20px rgba(255,92,138,.6);cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:7px solid var(--rose);cursor:grab}
.sum{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);margin-bottom:10px}
.sum i{font-style:normal;font-size:26px}.sum small{display:block;color:var(--gold);font-size:13px}
.ctr{text-align:center}.ctr svg{display:block;margin:0 auto 10px}
.hb{transform-origin:60px 60px;animation:beat 1.1s infinite}@keyframes beat{50%{transform:scale(1.4)}}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:420px){.g3{grid-template-columns:1fr}.card{padding:28px 20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="sky s0"></div><div class="sky s1"></div><div class="sky s2"></div><div class="sky s3"></div><div class="sky s4"></div>
<div class="blob" style="left:-10vmax;top:-10vmax;background:#ff6fa5"></div>
<div class="blob" style="right:-12vmax;bottom:-8vmax;background:#ffb27a;animation-delay:-7s"></div>

<canvas id="fx"></canvas>
<main class="stage"><div class="wrap"><div class="dots" id="dots" role="progressbar" aria-valuemin="1" aria-valuemax="8"></div><section class="card flat" id="card"></section></div></main>
<script>
const $=s=>document.querySelector(s),card=$('#card'),dEl=$('#dots'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const PHONE=''; // your WhatsApp number with country code, e.g. '919876543210'
const S={step:0,date:null,time:null,acts:[],other:'',restaurant:null,lvl:7,vy:new Date()};S.vy.setDate(1);
const TIMES=[['☀️','Morning','9 AM – 12 PM',1,9],['🌤️','Afternoon','12 PM – 5 PM',2,12],['🌇','Evening','5 PM – 8 PM',3,17],['🌙','Night','8 PM onwards',4,20]];
const ACTS=[['🎳','Bowling'],['🎬','Movie'],['🖼️','Museum'],['⛳','Mini Golf'],['🎮','Arcade'],['🏸','Badminton'],['🎱','Pool'],['🎨','Art Café'],['☕','Café Hopping'],['🍽️','Fine Dining'],['🌆','Evening Walk'],['🌅','Sunset View']];
const RESTAURANTS=[
['Chianti, Indiranagar','Indiranagar · 0.9 km','Italian · Pizza · Pasta'],
['Harvest Salad Co','Indiranagar · 1.3 km','Salad · Healthy · Mediterranean'],
['Burma Burma - Indiranagar','Indiranagar · 1.3 km','Burmese · Asian'],
['Toit','Indiranagar · 1.9 km','Italian · European · Continental'],
['Mūru Mūru','Indiranagar · 2.2 km','Cafe · Mexican · North Indian'],
['Bologna','Indiranagar · 1.1 km','Italian · Pasta · Pizza'],
['The Kind Roastery & Brew Room','Indiranagar · 1.2 km','Cafe · Coffee · Asian · Pizza'],
['Milano Ice Cream','Indiranagar · 2.0 km','Ice Cream · Desserts'],
['Rim Naam - The Oberoi','MG Road · 2.3 km','Thai · Asian · Seafood'],
['Republic Of Noodles','Ulsoor · 3.5 km','Pan-Asian · Thai · Chinese'],
["Fia's Lounge",'Richmond Road · 3.7 km','Parsi · Italian · European'],
['The Konkan (Est. 2017)','St. Marks Road · 4.1 km','Konkani · Mangalorean · Seafood'],
['Truffles','Koramangala · 4.0 km','Burger · Italian · Continental'],
['Biergarten','Koramangala · 4.0 km','North Indian · Continental · BBQ'],
['Kalpaney','Domlur · 4.8 km','South Indian · Asian'],
["Daffy's Brewgarden",'Indiranagar · 5.1 km','South Indian · Bar Food'],
['KOKO','Old Airport Road · 5.9 km','Asian · Sushi · Chinese · Japanese'],
['Seta','Domlur · 6.1 km','Asian · Mediterranean'],
['Sidewalk Cafe & Bar','Domlur','Cafe · Bar'],
['Vembanad','Domlur','Kerala · Seafood']
];
let restaurantChoices=[];
let lastRestaurantSignature='';
function randomRestaurants(){
  let shuffled=[...RESTAURANTS];
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
  let picks=shuffled.slice(0,3);
  let signature=picks.map(r=>r[0]).sort().join('|');
  if(signature===lastRestaurantSignature){
    const swapIndex=3+Math.floor(Math.random()*(shuffled.length-3));
    [shuffled[2],shuffled[swapIndex]]=[shuffled[swapIndex],shuffled[2]];
    picks=shuffled.slice(0,3);
    signature=picks.map(r=>r[0]).sort().join('|');
  }
  lastRestaurantSignature=signature;
  restaurantChoices=picks.map(r=>({id:RESTAURANTS.indexOf(r),name:r[0],area:r[1],cuisine:r[2]}));
}
function restaurantCard(r){return `<button class="opt restaurant-opt${S.restaurant&&S.restaurant.id===r.id?' sel':''}" data-rid="${r.id}"><b>🍽️</b><strong>${r.name}</strong><small>${r.cuisine}</small><small>📍 ${r.area}</small></button>`;}
const EM=['😐','🙂','🙂','😊','😊','😄','😄','🥰','😍','🤩'];
const NO=['No 🙈','Are you sure? 🥺','Really? 😢','Think again 💭','Pretty please? 🥹','Last chance… 😳'];
dEl.innerHTML='<i></i>'.repeat(8);
const words=t=>t.split(' ').map((w,k)=>`<span class="w" style="--k:${k}">${w}</span>`).join('');
const nav=(ok,l='Next')=>`<div class="nav"><button class="btn ghost" id="bk">Back</button><button class="btn" id="nx" ${ok?'':'disabled'}>${l}</button></div>`;
const mood=i=>document.querySelectorAll('.sky').forEach((e,k)=>e.style.opacity=k==i?1:0);
const go=n=>{
 card.classList.add('out');
 setTimeout(()=>{
   const floating=document.querySelector('body>#no');
   if(floating){
     const oldRow=document.querySelector('#card .row');
     if(oldRow)oldRow.appendChild(floating);
     floating.style.position='';
     floating.style.left='';
     floating.style.top='';
     floating.style.margin='';
   }
   document.getElementById('no-slot')?.remove();
   S.step=n;
   draw();
 },330)
};
const fmt=d=>d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const actsTxt=()=>[...S.acts.map(i=>ACTS[i][0]+' '+ACTS[i][1]),...(S.other.trim()?['✨ '+S.other.trim()]:[])].join(', ');
const addD=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const sat=w=>addD(((6-new Date().getDay()+7)%7||7)+w*7);
let dodges=0;
function dodge(e){
 const b=$('#no'),y=$('#yes');
 if(!b)return;
 dodges++;

 const r=b.getBoundingClientRect(),w=r.width,h=r.height;
 const W=innerWidth,H=innerHeight;
 const safe=24,gap=14;
 const q=y.getBoundingClientRect();

 // Keep an invisible same-size slot where No originally lived.
 // This prevents the Yes button from re-centering in the flex row.
 let slot=document.getElementById('no-slot');
 if(!slot){
   slot=document.createElement('span');
   slot.id='no-slot';
   slot.className='no-slot';
   slot.style.width=w+'px';
   slot.style.height=h+'px';
   b.parentElement.insertBefore(slot,b);
 }

 // Move only No outside the transformed card. Fixed coordinates are then
 // relative to the actual browser viewport.
 if(b.parentElement!==document.body){
   document.body.appendChild(b);
   b.style.position='fixed';
   b.style.margin='0';
   b.style.left=r.left+'px';
   b.style.top=r.top+'px';
   b.offsetWidth;
 }

 const isFinalButton=dodges>=NO.length;

 const px=Math.min(Math.max(r.left+w/2,safe+w/2),W-safe-w/2);
 const py=Math.min(Math.max(r.top+h/2,safe+h/2),H-safe-h/2);
 // Random displacement: up to 150px from the previous position
 // (3x the original 50px range), while remaining inside the viewport.
 // Real displacement: choose a DIFFERENT quadrant of the viewport
 // for each escape, so the button can jump from Q4 -> Q1/Q2/Q3,
 // rather than making another nearby move.
 const candidates=[];
 const centerX=W/2, centerY=H/2;

 const currentQuadrant =
   (px >= centerX ? 1 : 0) + (py >= centerY ? 2 : 0);

 const otherQuadrants=[0,1,2,3].filter(q=>q!==currentQuadrant);

 // Randomize the order so there is no predictable escape pattern.
 otherQuadrants.sort(()=>Math.random()-.5);

 for(let i=0;i<120;i++){
   // Prefer one of the other three quadrants, with the first few
   // candidates spread across different quadrants.
   const q=otherQuadrants[i%otherQuadrants.length];

   const left   = q%2===0 ? safe : centerX+8;
   const right  = q%2===0 ? centerX-8 : W-w-safe;
   const top    = q<2     ? safe : centerY+8;
   const bottom = q<2     ? centerY-8 : H-h-safe;

   if(right<=left || bottom<=top) continue;

   candidates.push({
     x:left+Math.random()*(right-left),
     y:top+Math.random()*(bottom-top)
   });
 }

 // Also include deliberately far cross-screen jumps.
 [
   [safe,safe],
   [W-w-safe,safe],
   [safe,H-h-safe],
   [W-w-safe,H-h-safe]
 ].forEach(([x,y])=>{
   const q=(x+w/2>=centerX?1:0)+(y+h/2>=centerY?2:0);
   if(q!==currentQuadrant) candidates.push({x,y});
 });

 const intersects=(a,b,pad=0)=>
   a.x < b.right+pad && a.x+a.w > b.left-pad &&
   a.y < b.bottom+pad && a.y+a.h > b.top-pad;

 const textRects=[...document.querySelectorAll(
   '#card h1,#card h2,#card .sub,#card .dots,#card .nav'
 )].map(el=>el.getBoundingClientRect());

 let chosen=null;
 for(const c of candidates){
   const x=Math.max(safe,Math.min(W-w-safe,c.x));
   const t=Math.max(safe,Math.min(H-h-safe,c.y));
   const box={x,y:t,w,h,left:x,right:x+w,top:t,bottom:t+h};

   if(!intersects(box,q,gap) &&
      !textRects.some(rect=>intersects(box,rect,10)) &&
      Math.hypot(x+w/2-(e?.clientX??px),t+h/2-(e?.clientY??py))>=35){
     chosen={x,t};
     break;
   }
 }

 if(!chosen){
   const spots=[
     [safe,safe],[W-w-safe,safe],
     [safe,H-h-safe],[W-w-safe,H-h-safe]
   ];
   chosen=spots
     .map(([x,t])=>({x,t}))
     .find(c=>!intersects({
       x:c.x,y:c.t,w,h,left:c.x,right:c.x+w,top:c.t,bottom:c.t+h
     },q,gap)) || {x:safe,t:safe};
 }

 b.style.left=chosen.x+'px';
 b.style.top=chosen.t+'px';
 b.textContent=isFinalButton ? 'Okay fine… Yes? 🫣' : NO[dodges];
}
const V=[
 ()=>`<h1>${words('Jassica, will you go on a date with me?')}</h1><p class="sub">Take your time… though one of these buttons might be a little shy.</p><div class="row"><button class="btn pulse" id="yes">Yes ❤️</button><button class="btn ghost" id="no">${NO[0]}</button></div>`,
 ()=>`<h2>${words('Which day would you like to go on our date?')}</h2><p class="sub">Any day that feels right — I’m free when you are.</p><div class="chips"><button class="chip" data-q="1">Tomorrow</button><button class="chip" data-q="s0">This Saturday</button><button class="chip" data-q="s1">Next Saturday</button><button class="chip" data-q="r">Surprise me 🎲</button></div><div id="calw"></div><div class="pick" id="pk"></div>${nav(!!S.date)}`,
 ()=>`<h2>${words('What time works best for you?')}</h2><p class="sub">Morning coffee or a night under the lights — your call.</p><div class="grid g2">${TIMES.map((t,i)=>`<button class="opt${S.time===i?' sel':''}" data-i="${i}"><b>${t[0]}</b>${t[1]}<small>${t[2]}</small></button>`).join('')}</div>${nav(S.time!=null)}`,
 ()=>`<h2>${words('What would you enjoy doing together?')}</h2><p class="sub">Pick as many as you like — we’ll make a perfect mix. <span id="ct"></span></p><div class="grid g3">${ACTS.map((a,i)=>`<button class="opt${S.acts.includes(i)?' sel':''}" data-i="${i}"><b>${a[0]}</b>${a[1]}</button>`).join('')}</div><div class="chips" style="margin-top:14px"><button class="chip" id="sp">Surprise me 🎁</button><input id="oth" placeholder="Or suggest your own idea…" aria-label="Your own idea"></div>${nav(0)}`,
